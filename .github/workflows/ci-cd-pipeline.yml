name: CI/CD Pipeline - FinTech Nova

on:
  push:
    branches:
      - main

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Auditoria de Seguridad (pip-audit)
        uses: pypa/pip-audit-action@v3.5.0
        with:
          inputs: requirements.txt

      - name: Construir imagen Docker
        run: docker build -t fintech-nova:${{ github.sha }} .
